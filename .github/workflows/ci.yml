name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

# Cancel in-progress CI runs on the same branch when a new push arrives.
# This avoids burning matrix minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # PR title validation
  # The squash-merge strategy means the PR title becomes the commit message on
  # main. Enforcing conventional-commit format here keeps release discipline
  # with maintainers at merge time — contributors don't need to worry about it
  # on every commit in their feature branch.
  # ---------------------------------------------------------------------------
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    # Only meaningful on PRs; push events skip this.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must not be empty after the type prefix"

  # ---------------------------------------------------------------------------
  # Lint — ruff check and format
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[no ci]')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install ruff
      - run: ruff check altergo.py
      - run: ruff format --check altergo.py

  # ---------------------------------------------------------------------------
  # Tests — compile check, smoke test, and pytest across Python versions and OSes
  # Runs after lint to avoid burning matrix minutes on broken code
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    if: "!contains(github.event.head_commit.message, '[no ci]')"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
      - run: python -m py_compile altergo.py
      - run: python altergo.py --version
      - run: pip install pytest
      - run: pytest -v
