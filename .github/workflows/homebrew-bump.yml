name: Homebrew Tap Bump

# Fires on every version tag push (e.g. v0.5.0).
# Opens a PR against thepixelabs/homebrew-tap bumping the altergo formula's
# url and sha256 to match the newly published PyPI source tarball.
#
# Prerequisites
# -------------
# GH_TOKEN must be a PAT (classic or fine-grained) with:
#   - Contents: Read and Write  (on thepixelabs/homebrew-tap)
#   - Pull requests: Read and Write  (on thepixelabs/homebrew-tap)
# The secret is already present in this repo (used by release.yml).
#
# v0.5.0 caveats note
# -------------------
# altergo 0.5.0 changed the session-store layout from ~/.altergo/ to
# ~/.altergo/accounts/<name>/.  The formula for 0.5.0 and later MUST include
# a `caveats` Ruby block directing existing users to run `altergo --migrate`
# (or similar) on first upgrade.  Because this workflow patches only the url
# and sha256 lines, it cannot inject the caveats block automatically.  For
# every minor/major release the PR body includes an explicit checklist item
# and a ready-to-paste Ruby snippet reminding the tap maintainer to add the
# block before merging.  See the "Open PR against tap" step below.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

# Deny all permissions at the workflow level; the job below grants only what
# it needs.  Write access to the tap repo is handled via GH_TOKEN, not
# GITHUB_TOKEN — GITHUB_TOKEN has no rights over a different repository.
permissions: {}

# Prevent two runs from racing to open duplicate PRs when tags are pushed in
# quick succession.  A second run will queue and then (if the branch already
# exists) push --force-with-lease over the first commit.
concurrency:
  group: homebrew-bump-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bump-tap:
    name: Bump tap formula
    runs-on: ubuntu-latest
    # Only run when the Release workflow actually published a new release.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # This job reads nothing from this repo — it only checks out the tap.
    # No GITHUB_TOKEN permissions are needed; all GitHub API calls use GH_TOKEN.
    permissions:
      actions: read   # needed to query the triggering workflow_run

    steps:
      - name: Extract version and build tarball URL
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Find the version tag that was created by the Release workflow run
          # that triggered this workflow.  semantic-release always creates a tag
          # of the form vX.Y.Z on the head commit of its run.
          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"

          HEAD_SHA=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.head_sha')
          TAG=$(gh api "repos/${REPO}/tags" --jq \
            --arg sha "${HEAD_SHA}" \
            '[.[] | select(.commit.sha == $sha) | select(.name | test("^v[0-9]"))] | first | .name')

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "No version tag found on ${HEAD_SHA} — skipping (no release was made)."
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          TARBALL_URL="https://files.pythonhosted.org/packages/source/a/altergo/altergo-${VERSION}.tar.gz"
          echo "tarball_url=${TARBALL_URL}" >> "$GITHUB_OUTPUT"

          # Determine whether this is a minor or major release (patch segment == 0)
          # Used later to surface the caveats checklist item in the PR body.
          PATCH_SEGMENT="$(echo "${VERSION}" | awk -F. '{print $3}')"
          if [ "${PATCH_SEGMENT}" = "0" ]; then
            echo "is_minor_or_major=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_minor_or_major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          TARBALL_URL="${{ steps.meta.outputs.tarball_url }}"
          if [ -z "${TARBALL_URL}" ]; then
            echo "No tarball URL — skipping (no release was made)."
            exit 0
          fi
          echo "Fetching: ${TARBALL_URL}"

          HTTP_STATUS=$(curl --silent --output altergo.tar.gz \
            --write-out "%{http_code}" \
            --location "${TARBALL_URL}")

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: PyPI tarball returned HTTP ${HTTP_STATUS}."
            echo "URL: ${TARBALL_URL}"
            exit 1
          fi

          SHA256=$(sha256sum altergo.tar.gz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA256}"

      - name: Checkout tap repo
        if: steps.meta.outputs.version != ''
        uses: actions/checkout@v4
        with:
          repository: thepixelabs/homebrew-tap
          token: ${{ secrets.GH_TOKEN }}
          path: tap

      - name: Patch formula
        if: steps.meta.outputs.version != ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARBALL_URL: ${{ steps.meta.outputs.tarball_url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          FORMULA="tap/Formula/altergo.rb"

          if [ ! -f "${FORMULA}" ]; then
            echo "ERROR: ${FORMULA} not found in tap repo."
            echo "Create the initial formula first, then re-run this workflow."
            exit 1
          fi

          # Update the url line (matches the full PyPI source tarball URL pattern)
          sed -i "s|url \"https://files.pythonhosted.org/packages/source/a/altergo/altergo-.*\.tar\.gz\"|url \"${TARBALL_URL}\"|" "${FORMULA}"

          # Update the sha256 line (matches any lowercase hex string in that position)
          sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|" "${FORMULA}"

          # Verify both substitutions landed — fail fast before pushing garbage
          grep -q "${TARBALL_URL}" "${FORMULA}" || { echo "ERROR: url substitution failed"; exit 1; }
          grep -q "${SHA256}"      "${FORMULA}" || { echo "ERROR: sha256 substitution failed"; exit 1; }

          echo "Formula patched successfully:"
          grep -E "^\s+(url|sha256)\b" "${FORMULA}"

      - name: Open PR against tap
        if: steps.meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          TARBALL_URL: ${{ steps.meta.outputs.tarball_url }}
          IS_MINOR_OR_MAJOR: ${{ steps.meta.outputs.is_minor_or_major }}
        run: |
          cd tap

          BRANCH="bump/altergo-${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add Formula/altergo.rb
          git commit -m "altergo ${VERSION}"

          # --force-with-lease is safe here: if the branch already exists from
          # a previous failed run of this workflow, we overwrite it rather than
          # erroring out.  A human push to the same branch would be rejected,
          # which is the intended safety net.
          git push --force-with-lease origin "${BRANCH}"

          # Build the PR body in a temp file to avoid quoting/heredoc edge cases.
          BODY_FILE="$(mktemp)"

          # Build body with a { echo; } block instead of a heredoc — heredoc
          # terminators must sit at column 0, which would break the YAML
          # literal block scalar indentation of this `run:` step.
          {
            echo '## altergo formula bump'
            echo ''
            echo "This PR was opened automatically by the \`homebrew-bump.yml\` workflow in"
            echo '[thepixelabs/altergo](https://github.com/thepixelabs/altergo).'
            echo ''
            echo '### Changes'
            echo ''
            echo "- **url** → \`${TARBALL_URL}\`"
            echo "- **sha256** → \`${SHA256}\`"
            echo ''
            echo '### Checklist before merging'
            echo ''
            echo '- [ ] `brew audit --new-formula Formula/altergo.rb` passes locally'
            echo '- [ ] `brew install --build-from-source Formula/altergo.rb` succeeds'
            echo "- [ ] \`altergo --version\` reports \`${VERSION}\`"
          } > "${BODY_FILE}"

          # For minor/major releases (patch == 0) surface the v0.5.0 layout-change
          # caveats reminder.  The formula must include a caveats block for any
          # release that changes the session-store layout (0.5.0 and later minor/
          # major bumps until the migration window closes in 0.6.0).
          if [ "${IS_MINOR_OR_MAJOR}" = "true" ]; then
            {
              echo ''
              echo '---'
              echo ''
              echo '> **Minor/major release — action required before merging**'
              echo '>'
              echo '> altergo 0.5.0 introduced a layout change: the session store moved from'
              echo '> `~/.altergo/` to `~/.altergo/accounts/<name>/`.  The formula MUST include'
              echo '> a `caveats` block directing existing users to the migration docs, for example:'
              echo '>'
              echo '> ```ruby'
              echo '> def caveats'
              echo '>   <<~EOS'
              echo '>     altergo 0.5.0 changes the session-store layout.'
              echo '>     On first run after upgrade, altergo will automatically migrate'
              echo '>     ~/.altergo → ~/.altergo/accounts/default/ and print a one-line notice.'
              echo '>     No manual steps are required.  See the full migration guide at:'
              echo '>       https://altergo.pixelabs.net/docs/migration-0.5'
              echo '>   EOS'
              echo '> end'
              echo '> ```'
              echo '>'
              echo '> This workflow patches only `url` and `sha256` — please add (or update)'
              echo '> the `caveats` block manually in this PR before merging.'
            } >> "${BODY_FILE}"
          fi

          gh pr create \
            --repo thepixelabs/homebrew-tap \
            --head "${BRANCH}" \
            --base main \
            --title "altergo ${VERSION}" \
            --body-file "${BODY_FILE}"

          rm -f "${BODY_FILE}"
