name: Release

on:
  push:
    branches: [main]

# Deny all permissions by default; the release job grants only what it needs.
permissions: {}

# Never cancel an in-flight release — a second push queues behind the running
# job rather than killing it mid-way through version bumping and tag creation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The pypi environment gates OIDC trusted publishing. CI correctness is
    # enforced by branch protection (require status checks on PRs) — not here.
    environment: pypi
    permissions:
      contents: write      # push version-bump commit and tag
      issues: write        # comment on issues referenced in commits
      pull-requests: write # comment on merged PRs with release link
      id-token: write      # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/checkout@v4
        with:
          # Use the GH_TOKEN PAT as the checkout token so its credentials are
          # persisted on the `origin` remote.  python-semantic-release shells
          # out to plain `git push`, which reads credentials from the remote
          # URL helper — not from the GH_TOKEN env var (that's a `gh` CLI
          # convention).  The PAT must also have permission to push to main
          # under any branch protection rules in force.
          token: ${{ secrets.GH_TOKEN }}
          # Full history required so python-semantic-release can walk back to
          # the last tag when computing which commits need a new version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip downloads keyed on the workflow file itself. The only deps
      # here are python-semantic-release and build — the workflow file hash is
      # a stable, correct cache key for this isolated tool environment.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-release-

      - name: Install release tooling
        run: |
          pip install --upgrade pip
          pip install "python-semantic-release==9.*" build

      - name: Configure git bot identity
        run: |
          git config --global user.name "Ground Control"
          git config --global user.email "ground-control@users.noreply.github.com"

      - name: Run python-semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: semantic-release version --push

      - name: Build sdist and wheel
        if: steps.release.outputs.released == 'true'
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
