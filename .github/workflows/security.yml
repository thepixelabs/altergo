name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

# Deny all permissions by default; jobs grant only what they need.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit — scan Python dependencies for known vulnerabilities (osv.dev).
  # altergo has no runtime deps; this audits the build/CI toolchain to catch
  # supply-chain issues in the tools that run in this repo's pipelines.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Cache pip downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('.github/workflows/security.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-
      - name: Upgrade pip
        # pip 26.0.1 ships with the setup-python toolchain and triggers
        # pip-audit findings against pip itself (CVE-2026-3219, CVE-2026-6357).
        # Bumping to the latest patched pip resolves the audit at the source
        # rather than accumulating per-CVE suppressions.
        run: python -m pip install --upgrade pip
      - name: Install pip-audit
        run: pip install pip-audit
      # altergo has no runtime dependencies. Auditing the build/dev toolchain
      # (setuptools, build, ruff, pytest, python-semantic-release, pip-audit
      # itself) catches supply-chain vulnerabilities in the CI environment.
      - name: Audit dev/build dependencies
        run: pip-audit --skip-editable --vulnerability-service osv

  # ---------------------------------------------------------------------------
  # OSV Scanner — cross-ecosystem vulnerability scan via osv.dev.
  # Scans the repo directory (picks up pyproject.toml and any requirements
  # files present). osv-scanner.toml holds reviewed suppressions.
  # ---------------------------------------------------------------------------
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=table
            .

  # ---------------------------------------------------------------------------
  # Dependency Review — block PRs that introduce high-severity vulnerabilities
  # or dependencies with disallowed licenses.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # TruffleHog is AGPL-3.0 but runs only as a CI tool — never
          # bundled into the product, so copyleft obligations don't apply.
          allow-dependencies-licenses: 'pkg:githubactions/trufflesecurity/trufflehog'

  # ---------------------------------------------------------------------------
  # TruffleHog — scan PR diff for secrets/credentials.
  # Runs on every PR so secrets are caught before they land on main.
  # ---------------------------------------------------------------------------
  secret-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --results=verified,unknown
            --exclude-paths=.github/trufflehog-exclude-paths.txt
      - name: Fail on findings
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::TruffleHog detected secrets in this change. See scan output above."
          exit 1

  # ---------------------------------------------------------------------------
  # TruffleHog full history — runs on the weekly schedule to catch secrets
  # that may have been present before this workflow was introduced.
  # ---------------------------------------------------------------------------
  secret-scanning-full:
    name: Secret Scanning (Full History)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: TruffleHog full history scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          path: ./
          extra_args: >-
            --results=verified,unknown
            --exclude-paths=.github/trufflehog-exclude-paths.txt
