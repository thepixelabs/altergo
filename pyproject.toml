[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "altergo"
version = "0.5.0"
description = "Your other Claude — switch Claude Code identities without losing a thought"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "thepixelabs" }]
keywords = ["claude", "claude-code", "multi-account", "session-manager", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
altergo = "altergo:main"

[project.urls]
Homepage = "https://altergo.pixelabs.net"
Repository = "https://github.com/thepixelabs/altergo"
Issues = "https://github.com/thepixelabs/altergo/issues"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["altergo.py:__version__"]
branch = "main"
build_command = "pip install build && python -m build"
commit_parser = "conventional_commits"

[tool.semantic_release.publish]
upload_to_pypi = false  # PyPI publish handled via trusted publishing in CI

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
